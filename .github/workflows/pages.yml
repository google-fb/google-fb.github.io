name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout user site
        uses: actions/checkout@v4

      - name: Checkout bloom-sim
        uses: actions/checkout@v4
        with:
          repository: google-fb/bloom-sim
          path: .bloom-sim-src

      - name: Checkout pixel-sec
        uses: actions/checkout@v4
        with:
          repository: google-fb/pixel-sec
          path: .pixel-sec-src

      - name: Checkout webgpu-voice-changer
        uses: actions/checkout@v4
        with:
          repository: google-fb/webgpu-voice-changer
          path: .webgpu-voice-changer-src

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build bloom-sim static export
        working-directory: .bloom-sim-src
        env:
          NEXT_PUBLIC_BASE_PATH: /bloom-sim
        run: |
          npm install
          npm run build

      - name: Build pixel-sec
        working-directory: .pixel-sec-src
        env:
          GITHUB_PAGES: 'true'
        run: |
          rm -f package-lock.json
          npm install
          npm run build

      - name: Build webgpu-voice-changer static export
        working-directory: .webgpu-voice-changer-src
        env:
          NEXT_PUBLIC_BASE_PATH: /webgpu-voice-changer
        run: |
          rm -f package-lock.json
          npm install
          npm run build

      - name: Publish project sites
        run: |
          rm -rf bloom-sim pixel-sec webgpu-voice-changer
          mkdir -p bloom-sim pixel-sec webgpu-voice-changer
          cp -a .bloom-sim-src/out/. bloom-sim/
          cp -a .pixel-sec-src/dist/. pixel-sec/
          cp -a .webgpu-voice-changer-src/out/. webgpu-voice-changer/
          touch bloom-sim/.nojekyll pixel-sec/.nojekyll webgpu-voice-changer/.nojekyll .nojekyll
          rm -rf .bloom-sim-src .pixel-sec-src .webgpu-voice-changer-src

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
